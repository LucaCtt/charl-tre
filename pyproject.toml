[project]
name = "charl-tre"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "causalts>=0.25.2",
    "h5py>=3.16.0",
    "optuna>=4.7.0",
    "optuna-integration[pytorch-distributed]>=4.7.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.12.0",
    "rich>=14.3.1",
    "tigramite>=5.2.10.1",
    "torch>=2.9.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.8",
    "scienceplots>=2.2.2",
    "scikit-learn>=1.8.0",
]

[project.scripts]
opt = "charl_tre.scripts.opt:opt"
test = "charl_tre.scripts.test:test"
latents = "charl_tre.scripts.latents:latents"
causal = "charl_tre.scripts.causal:causal"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "ALL", # include all the rules, including new ones
]
ignore = [
    "CPY001",  # Missing copyright notice
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D203",    # Incorrect blank line before class
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean-typed keyword argument in function definition
    "FBT003",  # Boolean-typed variable annotation
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments (6 > 5)
    "TC001",
    "TC002",
    "TC003",
    "UP037",   # Remove quotes from type annotation
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201"]  # `print` found
