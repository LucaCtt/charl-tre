name: csi_vae_gumbel

services:
  train:
    build:
      context: ..
      dockerfile: docker/opt.dockerfile
    container_name: charl_tre_opt
    environment:
      - MASTER_ADDR=charl_tre_opt
      - MASTER_PORT=12345
    env_file:
      - path: .env
        required: false
    volumes:
      - ${PWD}/out:/app/out
      - ${PWD}/dataset:/app/dataset
    restart: on-failure:3
    shm_size: '16g'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    runtime: nvidia